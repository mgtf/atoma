name: CLA

# Contributor licence agreement check (CLA Assistant Lite). A pull request from
# an author who has not signed CLA.md gets a comment and a failing status; the
# author signs by posting the sentence below as a PR comment. Signatures are
# committed to the unprotected `cla-signatures` branch, never to `main`.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/mgtf/atoma/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla-v1.json'
          branch: 'cla-signatures'
          allowlist: 'mgtf,bot*'
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >-
            Thank you for the contribution. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/mgtf/atoma/blob/main/CLA.md)
            and sign it by posting the sentence below as a comment on this pull request.
            Your signature is recorded once and covers your future contributions.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
