name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never discard the worker proof for a commit already on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: Hermetic checks (Docker integration skipped)
    runs-on: ubuntu-latest
    # `viz:smoke` no longer runs here (see release:check), so this step is back
    # to hermetic work: tests, audit, build, and the node-only release smokes.
    # The browser arms were what made the step's cost swing ~1.7x with nothing
    # but which machine picked the job up.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run release:check

  i18n:
    name: Translate blank locale values
    # The auto-translation half of the locale pipeline (the manual half is the
    # pre-commit hook that blanks stale target values when en.json changes).
    # A STEP of this CI run, not a second workflow: one runner, one queue, one
    # place to read the pipeline's health. `translate` isolates locales, and
    # the commit step below runs ALWAYS: surviving blanks are reported in the
    # summary, never dropped with the runner, and a later push retries them.
    # Only `check` failing (placeholder corruption) leaves the catalog
    # uncommitted and turns the job red.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Job-level: this job commits translations; the rest of CI stays read-only.
      contents: write
    concurrency:
      # Run-level group instead of the workflow's branch group: two pushes to
      # main may safely overlap elsewhere, but never two translation commits.
      group: i18n-translate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # invalidate-staged compares against HEAD, and translate must see the
          # locale files as committed.
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      # No npm ci: the i18n script is dependency-free (node:fs, node:child_process).
      - name: Blank placeholder-drifted values
        run: node scripts/i18n.mjs fix-drift --apply

      - name: Translate missing keys
        env:
          # GitHub cannot reuse a developer's personal ChatGPT Pro session.
          # CI therefore uses the separately billed OpenAI API credential.
          ATOMA_I18N_BACKEND: openai
          ATOMA_I18N_CODEX_MODEL: gpt-5.6-sol
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/i18n.mjs translate
        # A hard locale failure still exits 1 here — but that MUST NOT skip
        # the steps below: they land every catalog the run earned on disk.
        # Dying before them repeats the 2026-08-27 loss exactly (712 paid ar
        # translations written to disk, then dropped with the runner).
        continue-on-error: true

      - name: Verify locale health
        if: always()
        run: node scripts/i18n.mjs check

      - name: Commit translated locale files
        # The commit step defines the job's verdict: `check` passing means
        # placeholder integrity holds, so what translate earned gets committed.
        if: always()
        run: |
          git config user.name "atoma-i18n-bot"
          git config user.email "actions@github.com"
          git add src/viz/client/locales
          if git diff --cached --quiet; then
            echo "No locale changes to commit."
          else
            git commit -m "chore(i18n): auto-translate missing locale values [skip ci]"
            # A push may land on main during the ~30 min translate window;
            # rebasing onto it beats failing the job over a fast-forward race.
            for attempt in 1 2 3; do
              if git -c user.name="atoma-i18n-bot" -c user.email="actions@github.com" \
                  pull --rebase --autostash origin "${{ github.ref_name }}" && \
                 git push origin "HEAD:${{ github.ref_name }}"; then
                exit 0
              fi
              echo "push rejected (attempt $attempt); rebasing and retrying…"
              sleep $((attempt * 10))
            done
            echo "could not land the translation commit after 3 attempts" >&2
            exit 1
          fi

  worker:
    name: Fresh worker image
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:worker:dev
      - run: test -f dist/tools/worker.js && test -f dist/contracts/probeManifest.js
      - run: npx vitest run tests/container-isolation.test.ts
        env:
          CI_REQUIRE_DOCKER: "1"
