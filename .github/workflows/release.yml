name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - name: Verify release tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run release:check

      - name: Build release archive
        run: |
          set -euo pipefail
          root="atoma-${GITHUB_REF_NAME}"
          mkdir -p "release/${root}"
          cp -R dist docker scripts docs deploy src "release/${root}/"
          cp package.json package-lock.json LICENSE README.md AGENTS.md CLAUDE.md CHANGELOG.md SECURITY.md .env.example "release/${root}/"
          tar -C release -czf "release/${root}.tar.gz" "${root}"
          (cd release && sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256")

      - name: Verify extracted production install
        run: |
          set -euo pipefail
          root="atoma-${GITHUB_REF_NAME}"
          (cd release && sha256sum -c "${root}.tar.gz.sha256")
          mkdir -p /tmp/atoma-release
          tar -C /tmp/atoma-release -xzf "release/${root}.tar.gz"
          cd "/tmp/atoma-release/${root}"
          npm run docs:check
          node scripts/supervisor-release-smoke.mjs .
          npm ci --omit=dev
          node scripts/release-smoke.mjs
          node scripts/auth-release-smoke.mjs
          npm run auth -- --help
          npm run doctor -- --help
          npm run build:worker
          npm run release:container-smoke
          set +e
          ATOMA_BUILD_TIMEOUT_MS=invalid npm run run:build -- "compiled release preflight"
          code=$?
          set -e
          test "$code" -eq 2

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="atoma-${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" \
            "release/${root}.tar.gz" \
            "release/${root}.tar.gz.sha256" \
            --verify-tag \
            --title "atoma ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
