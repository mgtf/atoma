name: Mender

# THE MENDER'S HOST (supervisor stage 3, docs/supervisor-design.md).
#
# A production analyst that finds a cited, high-confidence defect sends ONE
# `repository_dispatch` here with the sanitised finding as its payload. This
# runner has what the production host must never carry — a git checkout with
# its remote, the devDependencies, `gh`, a model credential — and nothing else
# to do, so the mender's idle gate is switched off on purpose. The model edits
# an isolated worktree and runs the checks; the harness verifies (the new test
# fails before the source change, the full check passes after), commits,
# pushes a `mender/*` branch and opens a pull request. A PERSON merges; the
# merge rides the ordinary CI → production deployment.
#
# `workflow_dispatch` takes the same payload by hand, for the first real mend
# and for re-driving one from a verdict file.

on:
  repository_dispatch:
    types: [atoma-mend]
  workflow_dispatch:
    inputs:
      request:
        description: 'One atoma.supervisor.mend-request/v1 object, as JSON'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One mend at a time, QUEUED: two mends racing to push branches and open PRs
  # from one runner pool would be the duplicate the Defect-Key exists to stop.
  group: mender
  cancel-in-progress: false

jobs:
  mend:
    name: Mend one cited defect
    runs-on: ubuntu-latest
    # Worktree `npm ci`, one model session (≤ 30 min by its own wall clock), a
    # full `npm run check`: generous, and a hung session is killed by the
    # mender's own timeout well before this.
    timeout-minutes: 90
    env:
      ATOMA_MENDER_MODEL: ${{ vars.ATOMA_MENDER_MODEL }}
      ATOMA_MENDER_BASE_URL: ${{ vars.ATOMA_MENDER_BASE_URL }}
      ATOMA_MENDER_AUTH_TOKEN: ${{ secrets.ATOMA_MENDER_AUTH_TOKEN }}
      # `gh pr create` and the branch push. A fine-grained PAT when the
      # repository forbids Actions from opening pull requests; the workflow
      # token otherwise.
      GH_TOKEN: ${{ secrets.ATOMA_MENDER_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # FULL history: the mender cuts its worktree from `origin/main` and
          # the pull request's diff is read against it.
          fetch-depth: 0
          token: ${{ secrets.ATOMA_MENDER_GITHUB_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Install the headless model CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write the mend request
        shell: bash
        env:
          DISPATCHED: ${{ toJSON(github.event.client_payload) }}
          MANUAL: ${{ github.event.inputs.request }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            printf '%s' "${DISPATCHED}" > "${RUNNER_TEMP}/request.json"
          else
            printf '%s' "${MANUAL}" > "${RUNNER_TEMP}/request.json"
          fi
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${RUNNER_TEMP}/request.json"

      - name: Give the harness a committer identity
        run: |
          git config user.name "atoma mender"
          git config user.email "mender@atoma.invalid"

      - name: Mend
        shell: bash
        run: |
          set -euo pipefail
          npm run mender:dev -- \
            --finding-file "${RUNNER_TEMP}/request.json" \
            --no-idle-gate \
            --repo "${GITHUB_WORKSPACE}" \
            --supervisor-dir "${RUNNER_TEMP}/supervisor"

      - name: Keep the mend record whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mender-${{ github.run_id }}
          path: ${{ runner.temp }}/supervisor
          if-no-files-found: ignore
          retention-days: 30
